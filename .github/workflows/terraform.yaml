name: Terraform CI/CD - Dev

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write   # REQUIRED for OIDC → ADC

jobs:
  terraform-plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP (OIDC → Workload Identity → ADC)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/274706747500/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-github@terraform-482817.iam.gserviceaccount.com

      # 3️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 4️⃣ Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 5️⃣ Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 6️⃣ Terraform Plan (preview only)
      - name: Terraform Plan
        run: terraform plan
  

  terraform-apply:
    name: Terraform Apply (Dev)
    runs-on: ubuntu-latest
    needs: terraform-plan

    # 🔐 Manual approval gate
    environment: dev

    defaults:
      run:
        working-directory: environments/dev

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP (again – fresh runner)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/274706747500/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-github@terraform-482817.iam.gserviceaccount.com

      # 3️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 4️⃣ Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 5️⃣ Terraform Apply (MANUAL)
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
